name: OREL CI

on:
  pull_request:
    branches: [main, fix/orel-reconcile-main-20261111]
  push:
    branches: [main, feat/orel-v1-finalization-20261111, fix/orel-reconcile-main-20261111, feat/windows-universal-hand-control]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows application and installers
        run: npm run desktop:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: orel-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
