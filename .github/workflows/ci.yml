name: OREL CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/assistant-core-permissions]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Gesture classifier tests
        run: npm run test:gestures
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
